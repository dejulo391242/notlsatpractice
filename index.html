.homecontent{padding:2rem 0 3rem}.section-heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1rem}.section-heading h2{font-size:1.82rem}.cards{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}.card,.panel,.summary,.check{background:white;border:1px solid var(--line);border-radius:12px}.card{padding:1.4rem 1.5rem 1.15rem;display:flex;flex-direction:column;border-top:4px solid #39539a}.card:nth-child(2){border-top-color:#456e64}.eyebrow{font-size:.78rem;font-weight:740;text-transform:uppercase;letter-spacing:.11em;color:var(--quiet)}.card h3{font-size:1.8rem;margin:.55rem 0 .4rem}.muted{color:var(--quiet);line-height:1.5}.card .muted{margin-bottom:1.1rem}.cardactions,.actions{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap}.cardactions{margin-top:auto}.cardactions a{font-size:.93rem}.status{font-size:.88rem;margin-top:1.15rem;padding-top:.8rem;border-top:1px solid var(--line);color:var(--quiet)}.notes{margin-top:1.5rem;line-height:1.6;font-size:.93rem;color:var(--quiet)}.notes summary{cursor:pointer;color:var(--ink);font-weight:650;width:fit-content}.notes p{margin-top:.5rem;max-width:83ch}.stage{padding:1.4rem 0 2.5rem}.bar,.searchbar,.sectionline{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.bar{margin-bottom:1.2rem}.bar h1,.summary h1,.check h1{font-size:clamp(1.85rem,4vw,2.6rem);margin-top:.26rem}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}.panel{padding:1.55rem;min-width:0}.panel h2{font-size:1.5rem;margin:.5rem 0 1rem}.reader p,.question-text{font-size:1.13rem;line-height:1.62}.reader p+p{margin-top:.8rem}.reader h3{font:700 .89rem "Segoe UI",sans-serif;color:var(--blue);margin:1.3rem 0 .55rem}.choices{display:grid;gap:.52rem;margin:1rem 0}.choice{position:relative;display:flex;gap:.72rem;align-items:baseline;border:1px solid var(--line);padding:.72rem .8rem;border-radius:7px;cursor:pointer;line-height:1.47}.choice:hover{background:#f4f7fb}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice:has(input:focus-visible){outline:3px solid #ba7600;outline-offset:2px}.letter{display:inline-grid;place-items:center;border:1px solid #acb9c9;flex:0 0 1.55rem;height:1.55rem;border-radius:50%;font-size:.8rem;font-weight:720}.choice.selected{background:#eef3fc;border-color:var(--blue)}.selected .letter{background:var(--blue);color:white;border-color:var(--blue)}.choice.lock{cursor:default}.correct{border-color:var(--green);background:#eef7f1}.outcome{background:#eef3f9;border-radius:7px;padding:.9rem;line-height:1.5}.outcome p{margin-top:.45rem}.searchbar{justify-content:flex-start;background:#e8edf4;padding:.65rem .9rem;border-radius:8px;margin-bottom:1rem}.searchbar label{font-size:.9rem;font-weight:650}.searchbar input{background:white;border:1px solid #9daebf;border-radius:5px;padding:.46rem;min-width:0}.searchbar span{font-size:.84rem;color:var(--quiet)}mark{background:#ffe397;color:#1a2835}.footnav{margin-top:1rem;background:white;padding:1rem;border:1px solid var(--line);border-radius:10px}.qnav{display:flex;gap:.38rem;flex-wrap:wrap}.qnav button{position:relative;min-width:2.45rem;padding:.48rem .64rem}.qnav .answered{background:#dbe7fa}.qnav .here{outline:2px solid var(--blue);outline-offset:1px}.qnav .flagged::after{content:"";position:absolute;right:2px;top:2px;border:4px solid transparent;border-right-color:#aa5b08;border-top-color:#aa5b08}.flag-on{background:#fff0cc}.sectionline+.sectionline{border-top:1px solid var(--line);margin-top:.9rem;padding-top:.9rem}.confirmwrap{max-width:780px;margin:2rem auto}.check,.summary{padding:1.6rem}.check p,.summary p{margin:.8rem 0;line-height:1.55}.resultlist{display:grid;gap:.4rem;margin:1rem 0}.resultlist button{display:grid;grid-template-columns:3.4rem 1fr auto;text-align:left;align-items:center;gap:.55rem;font-weight:500}.out{font-size:.85rem;color:var(--quiet)}.ok{color:var(--green)}.score{font-size:1.04rem;font-weight:700;color:var(- const sets = [{"id": "a", "name": "Practice set A", "detail": "Letters in the archive", "passages": [["Passage", ["A literary archive once plotted the surviving letters between two collaborators as a graph. A long valley in the line followed the publication of their first book. Visitors routinely described the valley as a quarrel. The graph gave them a count of letters, but its unbroken line encouraged them to read that count as a measure of friendship.", "When editors rebuilt the exhibit, they found that both writers had spent part of the interval in the same town. They could have talked without writing. During another part of it, restrictions on the post may have disrupted delivery. Neither discovery established that the writers remained close. Each supplied a route by which correspondence could diminish without a quarrel. Some envelopes also bore pencil annotations counting earlier exchanges, an apparent check on the surviving totals. But those annotations appeared only on envelopes that passed through the family collection. The same process that shaped the surviving record had shaped this apparent check on it.", "The editors kept the counts. Alongside them, they displayed the writers’ known addresses and marked the intervals for which the route of preservation was uncertain. A visitor could still argue for a quarrel. Now that argument had to account for when writing was necessary and which letters had a chance to survive. The exhibit had acquired no new letter from either writer. What it had acquired was a more honest way to describe a silence."]]], "questions": [{"skill": "Weaken", "stimulus": "A city painted the roofs of three apartment buildings white in June. In July those buildings used 18 percent less electricity for cooling than they had used the previous July. The housing director concludes that the new roof color accounts for most of the reduction.", "ask": "Which finding most weakens the director’s argument?", "choices": ["The roof paint cost less than replacing any one of the air-conditioning units.", "The three buildings had different electricity bills from one another before the roofs were painted.", "Nearby apartments with unchanged roofs and similar cooling equipment saw the same drop during an unusually cool July.", "Even after the roofs were painted, each building used more electricity in July than in May.", "The buildings’ residents had supported the painting project."], "answer": 2, "why": "The comparison buildings show what happened under similar weather conditions without the paint. Their matching decline gives a competing explanation for most of the savings. Comparing July with May does little to explain the change between the two Julys."}, {"skill": "Necessary assumption", "stimulus": "An archive charges a fixed fee for each image it licenses. Its director argues that doubling the fee will increase total licensing revenue next year. The fee will be the same for every license, and licenses are the archive’s only source of licensing revenue.", "ask": "Which assumption does the director’s prediction require?", "choices": ["The number of licenses sold next year will exceed half the number sold this year.", "No customer will buy fewer licenses next year.", "Processing a license will cost the archive less next year.", "Most customers have no access to a competing archive.", "Total licensing revenue increased last year."], "answer": 0, "why": "At double the fee, selling exactly half as many licenses yields the same revenue. Selling fewer yields less. A revenue increase therefore requires more than half the old volume, even though some customers might leave."}, {"skill": "Must be true", "stimulus": "Every score selected for a festival’s evening concert is performed live. No score performed live at the festival is available solely as a studio recording. At least one score composed by Neri is available solely as a studio recording.", "ask": "Which statement follows from the information above?", "choices": ["All of Neri’s scores were excluded from the evening concert.", "At least one score performed live was composed by Neri.", "Every score excluded from the evening concert is available solely as a studio recording.", "At least one score composed by Neri was not selected for the evening concert.", "Every score that is available in more than one format was selected for the evening concert."], "answer": 3, "why": "Take the one Neri score guaranteed to be studio-only. It cannot be performed live at this festival, so it cannot have been selected for the evening concert. The premises leave Neri’s other work open."}, {"skill": "Identify the flaw", "stimulus": "A survey of people leaving a neighborhood meeting found that four out of five respondents favor replacing curbside parking with a bus lane. The meeting had been organized by a group campaigning for the bus lane. The organizer concludes that about four out of five adults in the neighborhood favor the change.", "ask": "The argument is most vulnerable to which criticism?", "choices": ["It treats two proposals that could both be adopted as if only one were possible.", "It infers the views of a population from a group whose reason for attending may be related to those views.", "It assumes that whoever first proposed a policy understands it best.", "It relies on a prediction of an event that has already happened.", "It infers that a proposal is inexpensive solely because it is popular."], "answer": 1, "why": "People who attend a campaign’s meeting may be unusually supportive of its proposal. Even perfectly accurate counting at the exit would establish the views of respondents, while the conclusion concerns all neighborhood adults."}, {"skill": "Explain a discrepancy", "stimulus": "A repair cooperative introduced a free inspection for every bicycle it services. The proportion of serviced bicycles found to have a cracked cable rose the following month, even though the cooperative continued to receive the same mix of bicycles and the cables themselves had become more durable.", "ask": "Which fact best helps explain the increase?", "choices": ["The cooperative now charges less for replacing cables.", "Some bicycles contain more than one cable.", "Customers prefer inspections that take little time.", "The cooperative bought fewer new cables during the second month.", "Mechanics previously checked for small cracks only when a customer reported trouble, but now check every cable under magnification."], "answer": 4, "why": "More thorough inspections can reveal cracks that previously went unrecorded. The measured proportion can therefore rise even as cables become more durable. A price change alone does not explain the change in detection."}, {"skill": "Main point", "stimulus": "", "ask": "Which statement best expresses the author’s central claim?", "choices": ["Any archive built from surviving letters is too incomplete to support historical research.", "Postal restrictions explain every apparent gap in the correspondence.", "Changing how an archive describes a silence can improve historical inference while preserving uncertainty about what happened.", "Editors should restore the old graph once enough additional letters turn up.", "A stretch with few surviving letters generally signals a falling-out between correspondents."], "answer": 2, "why": "The author approves of the revised display because it keeps competing explanations visible. The passage explicitly leaves open whether the writers stayed close and offers no universal explanation for missing letters."}, {"skill": "Function", "stimulus": "", "ask": "Why does the author mention that the pencil annotations appear only on envelopes that passed through the family collection?", "choices": ["To identify the family member who destroyed the letters.", "To show why the annotations cannot independently establish how often all the writers corresponded.", "To date the introduction of restrictions on the post.", "To show that envelopes are more reliable evidence than the letters they contained.", "To explain why editors originally counted each envelope twice."], "answer": 1, "why": "The annotations come from just one route by which materials survived. That limits their value as an independent cross-check on the whole record, including material that never passed through the family collection."}, {"skill": "Apply a principle", "stimulus": "", "ask": "Which museum label would best reflect the author’s reasoning?", "choices": ["“The workshop closed in 1880, the date of its last surviving invoice.”", "“Since later invoices are missing, the workshop must have changed owners.”", "“The workshop’s later history cannot be investigated until another invoice appears.”", "“The last known invoice dates to 1880. The ledger for the following decade is missing, leaving the date of closure uncertain.”", "“Comparable workshops stayed open after 1880, so this one did too.”"], "answer": 3, "why": "The label distinguishes the observed end of a record from the inferred end of an activity. It also names the gap that prevents a firmer inference, just as the new display does."}]}, {"id": "b", "name": "Practice set B", "detail": "Maps in a public meeting", "passages": [["Passage A", ["A flood map used at a public meeting has to support a particular act: a resident must be able to find a street and tell which planning zone it falls in. Our first map displayed the depth of every field measurement and every proposed boundary. Residents spent the meeting asking where their streets were. More information had made an elementary task harder.", "We replaced that map with a base map of streets and planning zones. A companion sheet, keyed by street name, explains omitted measurements and records objections to the proposed boundaries. Both sheets are handed to everyone. A public map earns trust, in my view, when a reader can use it for the decision at hand and can find out what its makers set aside. A single sheet need not accomplish both jobs."]], ["Passage B", ["Anyone who has watched an audience decipher a crowded flood map will concede the case for simplification. But supplying an appendix does not settle a different question: which judgments will the audience recognize as judgments? When one planning boundary appears as a solid line, it acquires a kind of authority. A resident who sees no reason to doubt it may never turn to a companion sheet.", "In a meeting, people point to the map on the wall. What gets pointed to becomes the subject of discussion. Keep the streets clear by all means, and put the details elsewhere. But where a boundary is disputed, put a sign of that dispute on the map itself. Then the reader can decide whether the objection warrants a closer look."]]], "questions": [{"skill": "Evaluate an argument", "stimulus": "To free rehearsal rooms for evening use, a conservatory plans to charge students for reservations they leave unused. The director cites last month’s many empty rooms as evidence that the fee will make it easier for evening students to find a room. The fee would apply only to unused reservations.", "ask": "Which information would be most useful in evaluating the director’s reasoning?", "choices": ["Whether evening students prefer rehearsing alone or with a partner", "Whether neighboring conservatories employ more piano teachers", "Whether the conservatory’s total enrollment rose last year", "Whether all the rooms contain the same number of chairs", "Whether the empty rooms were booked at the times evening students wanted them"], "answer": 4, "why": "The plan targets reservations that block someone else’s use. If the empty rooms were unbooked or empty only when nobody wanted them, the cited vacancies provide little support for the plan. If they were booked at peak demand, the fee targets a relevant obstacle."}, {"skill": "Sufficient assumption", "stimulus": "Only proposals endorsed by two editors can enter a journal’s final review. Every proposal in final review receives written comments. Patel’s proposal has endorsements from two editors. The managing editor concludes that Patel’s proposal will receive written comments.", "ask": "Which additional statement would make the conclusion follow logically?", "choices": ["Every proposal that receives written comments enters final review.", "Some proposals with two endorsements receive no oral comments.", "Every proposal endorsed by two editors enters final review.", "Only editors who write comments can endorse proposals.", "At least one proposal in final review was endorsed by Patel."], "answer": 2, "why": "The first rule makes endorsement necessary for final review. The added rule makes endorsement sufficient as well, so Patel’s endorsements now lead to final review and then to written comments."}, {"skill": "Point of disagreement", "stimulus": "Inez argues that a theater should retain its weekday matinees even if ticket revenue never covers their operating costs, because the performances are the only ones some patrons can attend. Rowan agrees that some patrons can attend only matinees but insists that the theater should retain the matinees only if their ticket revenue will eventually cover their operating costs.", "ask": "The speakers disagree over which claim?", "choices": ["The theater should retain the weekday matinees even if ticket revenue will never cover their operating costs.", "Most matinee patrons can also attend evening performances.", "The matinees currently cover their operating costs.", "The theater should charge the same price for matinee and evening tickets.", "Adding more matinees would increase the theater’s total revenue."], "answer": 0, "why": "Hold the hypothetical fixed: ticket revenue never covers costs. Inez explicitly favors keeping the performances in that case. Rowan’s condition rules that out. Both accept the premise about access."}, {"skill": "Strengthen", "stimulus": "In a blind comparison, listeners were more likely to identify the melody in a crowded mix when a producer briefly reduced the volume of the backing instruments at the start of each melody note. The producer concludes that the timing of the reductions matters, beyond any benefit from simply lowering the average backing volume.", "ask": "Which additional result most strengthens the producer’s conclusion?", "choices": ["Most listeners could hum the melody after hearing it in isolation.", "The melody was played by the same instrument in every version.", "Some listeners preferred the sound of a louder backing track.", "With the same average backing volume and the same reductions shifted between melody notes, listeners identified the melody less often.", "Listeners varied widely in years of formal music training."], "answer": 3, "why": "Shifting identical reductions while holding average volume fixed changes the timing at issue. The resulting difference supports a timing effect. Using the same instrument is helpful but leaves average backing volume as a rival explanation."}, {"skill": "Parallel reasoning", "stimulus": "If a manuscript was typeset in the North Street workshop, its first page bears the workshop’s star. This manuscript’s first page bears no star. It follows that it was not typeset in the North Street workshop.", "ask": "Which argument most closely parallels that reasoning?", "choices": ["Every numbered print is signed. This print is signed, so it must be numbered.", "Every locker on the east wall has a brass hinge. This locker lacks a brass hinge, so it is not on the east wall.", "No cabinet in the lobby is locked. This cabinet is unlocked, so it must be in the lobby.", "Some early editions have blue covers. This edition has a blue cover, so it must be early.", "Every kiln in the old studio used gas. This kiln was in the old studio, so it used gas."], "answer": 1, "why": "Both arguments reason from a missing required feature to exclusion from a group. The kiln example is valid too, but it starts with membership and infers the feature, which is a different pattern."}, {"skill": "Agreement", "stimulus": "", "ask": "Which claim would both authors most likely accept?", "choices": ["A map made for a public meeting should contain every available measurement.", "A published map can replace local testimony once its scale has been explained.", "Residents’ annotations should always determine where official boundaries fall.", "Reducing the number of categories on a map necessarily increases public trust.", "A reader should be able to discover what a map’s main display leaves out."], "answer": 4, "why": "A provides a companion sheet and a way to locate omissions. B asks for a visible route from the base map to unresolved objections. Both want the reader to be able to discover what the main display omits."}, {"skill": "Relationship between passages", "stimulus": "", "ask": "How does Passage B respond to the kind of approach defended in Passage A?", "choices": ["It accepts the value of a legible base map but argues that a separate supplement can give disputed choices too little visibility.", "It denies that simplifying a map can make it easier to read.", "It argues that formal measurements should replace residents’ annotations.", "It offers evidence that the map described in Passage A predicted floods inaccurately.", "It agrees that a companion sheet by itself guarantees equal attention to every objection."], "answer": 0, "why": "B explicitly accepts the need for a readable map. The objection concerns what happens at the meeting: the base map commands attention, so B wants a visible signal wherever a displayed boundary is contested."}, {"skill": "Apply competing views", "stimulus": "", "ask": "Which change to Passage A’s proposed map would most directly address Passage B’s concern while preserving A’s basic design?", "choices": ["Remove the companion sheet once the base map is printed.", "Use one color for all flood zones.", "Print every field measurement directly over the street it concerns.", "Place a small numbered marker at e const main = document.getElementById("main");
const key = "lsat-practice-desk.attempts.v1";
const letters = "ABCDE";
const escapeText = str => String(str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let attempts = {};
try { attempts = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch { warn(); }
function warn(){document.getElementById("storageWarning").hidden = false}
function save(){try{localStorage.setItem(key,JSON.stringify(attempts))}catch{warn()}}
function blank(s){return {pos:0, choices:Array(s.questions.length).fill(null),flags:Array(s.questions.length).fill(false), submitted:false}}
function valid(s,t){const n=s.questions.length;return t && Array.isArray(t.choices)&&t.choices.length===n&&t.choices.every(v=>v===null||Number.isInteger(v)&&v>=0&&v<5)&&Array.isArray(t.flags)&&t.flags.length===n&&Number.isInteger(t.pos)&&t.pos>=0&&t.pos<n}
if(typeof attempts!=="object"||Array.isArray(attempts))attempts={};
sets.forEach(s=>{if(!valid(s,attempts[s.id])) delete attempts[s.id]});
let set, attempt, mode="home", query="";
const $ = id=>document.getElementById(id);
function count(){return attempt.choices.filter(v=>v!==null).length}
function score(s,a){return s.questions.filter((q,i)=>a.choices[i]===q.answer).length}
function btn(label,act,cls="",extra=""){return '<button type="button" data-act="'+act+'" class="'+cls+'" '+extra+'>'+label+'</button>'}
function screen(content,focus=true){main.innerHTML=content;if(focus){window.scrollTo(0,0);const title=main.querySelector("h1");if(title){title.tabIndex=-1;title.focus({preventScroll:true})}}}
function home(focus=true){mode="home";query="";screen(`<section class="hero"><div class="wrap"><div><h1>LSAT Practice Desk</h1><p>Work through an argument, weigh the evidence, and review the reasoning behind each answer.</p></div><aside class="official"><strong>Full-length practice</strong><p>Try the official LSAT interface with four free PrepTests in LawHub.</p><a href="https://www.lsac.org/lsat/prepare/official-lsat-practice-tests" target="_blank" rel="noopener">Open LSAC’s practice tests</a></aside></div></section><div class="wrap homecontent"><div class="section-heading"><h2>Your practice sets</h2></div><div class="cards">${sets.map(s=>{const a=attempts[s.id],label=a?(a.submitted?"Review answers":"Resume set"):"Start set";const status=a?(a.submitted?"Submitted · "+score(s,a)+" of 8 correct":a.choices.filter(v=>v!==null).length+" of 8 answered"):"Ready to start";return `<article class="card"><span class="eyebrow">${s.name}</span><h3>${s.detail}</h3><p class="muted">5 Logical Reasoning questions and 3 questions on ${s.id==="a"?"one passage":"a pair of passages"}.</p><div class="cardactions">${btn(label,"open-"+s.id,"primary")}<a href="data:application/pdf;base64,${packets[s.id]}" download="LSAT-Practice-Set-${s.id.toUpperCase()}.pdf">Download printable PDF</a></div><div class="status">${status}</div></article>`}).join("")}</div><details class="notes"><summary>How these sets work</summary><p>Both sets are untimed. You can skip questions, flag them, and change answers until you submit. Your browser saves your place on this device when storage is available. The last two pages of each PDF are a blank bubble sheet and a detachable answer key.</p><p>In a set, use Find to highlight a word or phrase in the displayed text. Separate terms with commas to highlight any of them. This feature is specific to this desk. Use an official LawHub PrepTest to rehearse the test-day controls.</p></details></div>`,focus)}
function openSet(id){set=sets.find(s=>s.id===id);attempt=attempts[id]||(attempts[id]=blank(set));save();query="";if(attempt.submitted)summary();else question()}
function nav(){return '<nav class="qnav" aria-label="Question navigation">'+set.questions.map((q,i)=>{const answered=attempt.choices[i]!==null,flag=attempt.flags[i],here=i===attempt.pos;return btn(i+1,"go-"+i,[answered?"answered":"",flag?"flagged":"",here?"here":""].join(" "),`aria-label="Question ${i+1}, ${answered?"answered":"unanswered"}${flag?", flagged":""}" ${here?'aria-current="step"':""}`)}).join("")+"</nav>"}
function outcome(q,i){const pick=attempt.choices[i];return pick===null?"Unanswered":pick===q.answer?"Correct":"Incorrect"}
function question(focus=true){
mode="question";const i=attempt.pos,q=set.questions[i],rev=attempt.submitted,rc=i>=5;
const body=rc?set.passages.map(([label,paras])=>`<h3>${label}</h3>${paras.map(p=>'<p data-find>'+escapeText(p)+'</p>').join("")}`).join(""):'<p data-find>'+escapeText(q.stimulus)+'</p>';
const choices=q.choices.map((c,k)=>{const sel=attempt.choices[i]===k;return `<label class="choice ${sel?"selected":""} ${rev?"lock":""} ${rev&&q.answer===k?"correct":""}"><input type="radio" name="answer" value="${k}" ${sel?"checked":""} ${rev?"disabled":""}><span class="letter">${letters[k]}</span><span data-find>${escapeText(c)}</span></label>`}).join("");
const explanation=rev?`<section class="outcome"><strong>${outcome(q,i)} · Correct answer ${letters[q.answer]}</strong><p>Your answer: ${attempt.choices[i]===null?"unanswered":letters[attempt.choices[i]]}. ${escapeText(q.why)}</p></section>`:"";
screen(`<div class="wrap stage"><div class="bar"><div><div class="eyebrow">${set.name} · ${rev?"Answer review":"Untimed practice"}</div><h1>${rc?"Reading Comprehension":"Logical Reasoning"}</h1></div>${btn(rev?"Score summary":"All practice sets",rev?"summary":"home","textbtn")}</div><div class="searchbar"><label for="finder">Find in this question</label><input id="finder" type="search" placeholder="Word, phrase, or comma list" value="${escapeText(query)}"><span id="hits" role="status"></span></div><div class="workspace"><article class="panel reader"><div class="eyebrow">${rc?"Reading for questions 6–8":"Argument or facts"}</div><h2>${rc?set.detail:"Read the stimulus"}</h2>${body}</article><section class="panel"><div class="sectionline"><span class="eyebrow">Question ${i+1} of ${set.questions.length}</span>${rev?"":btn(attempt.flags[i]?"Flagged":"Flag question","flag",attempt.flags[i]?"flag-on":"","aria-pressed="+attempt.flags[i])}</div><h2 id="stem" class="question-text" data-find>${escapeText(q.ask)}</h2><div class="choices" role="radiogroup" aria-labelledby="stem">${choices}</div>${rev?explanation:btn("Clear choice","clear","textbtn",attempt.choices[i]===null?"disabled":"")}</section></div><div class="footnav"><div class="sectionline">${nav()}<span id="answeredCount" class="muted">${count()} of 8 answered</span></div><div class="sectionline"><div class="actions">${btn("Previous","prev","",i===0?"disabled":"")}${i<set.questions.length-1?btn("Next","next","primary"):""}</div>${btn(rev?"Score summary":"Finish set",rev?"summary":"check",i===7?"primary":"")}</div></div></div>`,focus);highlight()}
function highlight(){const nodes=Array.from(main.querySelectorAll("[data-find]"));const terms=[...new Set(query.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean))].sort((a,b)=>b.length-a.length);let hits=0;for(const node of nodes){const str=node.textContent,lower=str.toLowerCase();node.textContent="";let pos=0;while(pos<str.length){let at=-1,term="";for(const t of terms){const j=lower.indexOf(t,pos);if(j>=0&&(at<0||j<at)){at=j;term=t}}if(at<0){node.append(str.slice(pos));break}node.append(str.slice(pos,at));const m=document.createElement("mark");m.textContent=str.slice(at,at+term.length);node.append(m);hits++;pos=at+term.length}}$("hits").textContent=terms.length?hits+" match"+(hits===1?"":"es"):""}
function go(i){attempt.pos=i;query="";save();question()}
function check(){mode="check";let remaining=set.questions.length-count();screen(`<div class="wrap"><div class="confirmwrap check"><div class="eyebrow">${set.name}</div><h1>Finish this set?</h1><p>${count()} of 8 questions answered. ${remaining?remaining+" unanswered "+(remaining===1?"question counts":"questions count")+" as incorrect.":"All questions have an answer."} ${attempt.flags.filter(Boolean).length} flagged for review.</p>${nav()}<p>Submitting locks your choices and opens the answer explanations.</p><div class="actions">${btn("Keep practicing","back")}${btn("Submit and score","submit","primary")}</div></div></div>`)}
function summary(){mode="summary";screen(`<div class="wrap"><div class="confirmwrap summary"><div class="eyebrow">${set.name}</div><h1>Your results</h1><p class="score">${score(set,attempt)} of 8 correct</p><p>Choose a question to review your answer and its explanation.</p><div class="resultlist">${set.questions.map((q,i)=>{const o=outcome(q,i);return btn(`<strong>Q${i+1}</strong><span>${q.skill}${attempt.flags[i]?" · flagged":""}</span><span class="out ${o==="Correct"?"ok":""}">${o}</span>`,"go-"+i)}).join("")}</div><div class="actions">${btn("All practice sets","home","primary")}${btn("Retake set","retake")}</div></div></div>`)}
function retake(){mode="retake";screen(`<div class="wrap"><div class="confirmwrap check"><div class="eyebrow">${set.name}</div><h1>Start a fresh attempt?</h1><p>This replaces your answers, score, and flags for this set on this device.</p><div class="actions">${btn("Keep results","summary")}${btn("Start again","reset","primary")}</div></div></div>`)}
main.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(a.startsWith("open-"))return openSet(a.slice(5));if(a.startsWith("go-"))return go(Number(a.slice(3)));switch(a){case"home":home();break;case"back":question();break;case"prev":go(attempt.pos-1);break;case"next":go(attempt.pos+1);break;case"flag":attempt.flags[attempt.pos]=!attempt.flags[attempt.pos];save();question(false);main.querySelector('[data-act="flag"]').focus({preventScroll:true});break;case"clear":attempt.choices[attempt.pos]=null;save();question(false);main.querySelector('input[name="answer"]').focus({preventScroll:true});break;case"check":check();break;case"submit":attempt.submitted=true;save();summary();break;case"summary":summary();break;case"retake":retake();break;case"reset":attempt=attempts[set.id]=blank(set);save();query="";question();break}});
main.addEventListener("change",e=>{if(e.target.name!=="answer"||mode!=="question"||attempt.submitted)return;attempt.choices[attempt.pos]=Number(e.target.value);save();main.querySelectorAll(".choice").forEach((el,k)=>el.classList.toggle("selected",k===attempt.choices[attempt.pos]));main.querySelector('[data-act="clear"]').disabled=false;const n=main.querySelector(".qnav");n.outerHTML=nav();$("answeredCount").textContent=count()+" of 8 answered"});
main.addEventListener("input",e=>{if(e.target.id==="finder"){query=e.target.value;highlight()}});
document.addEventListener("keydown",e=>{if(mode==="question"&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"){e.preventDefault();$("finder").focus();$("finder").select()}});
$("homeLink").addEventListener("click",e=>{e.preventDefault();home()});home(false);
</script></body></html>
